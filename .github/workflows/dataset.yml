name: Build SURDOC dataset

# Incremental open-data export of surdoc.cl, published to GitHub Pages.
# Daily runs crawl a rolling MAX_PAGES window that advances each day (cursor in
# data/crawl-state.json), sweeping the whole catalog every ~19 days — SURDOC has
# no working sort and new records scatter through every institution's block, so
# a fixed window misses them. A monthly run does a full crawl (MAX_PAGES=0) as a
# backstop. Both accumulate the committed index.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC — tail-window
    - cron: "0 4 1 * *" # monthly, 1st 04:00 UTC — full crawl
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages to crawl this run (0 = all ~3700)"
        default: "200"
      roll:
        description: "Advance a rolling MAX_PAGES window across runs (1/0)"
        default: "1"
      detail:
        description: "Also fetch full record detail (1/0)"
        default: "1"
      skip_index:
        description: "Skip index crawl, reuse committed index.json (1/0)"
        default: "0"

permissions:
  contents: write # commit the accumulated dataset back
  pages: write
  id-token: write

concurrency:
  group: surdoc-dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build dataset slice
        # Monthly cron → full crawl (MAX_PAGES=0). Daily cron / manual → tail window.
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || (github.event.schedule == '0 4 1 * *' && '0' || '200') }}
          ROLL: ${{ github.event.inputs.roll || (github.event.schedule == '0 4 1 * *' && '0' || '1') }}
          DETAIL: ${{ github.event.inputs.detail || '1' }}
          SKIP_INDEX: ${{ github.event.inputs.skip_index || '0' }}
        run: bun run build:dataset

      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: refresh SURDOC dataset slice [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: data

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
